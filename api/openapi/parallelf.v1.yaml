      summary: The cloud audit trail
      description: Append-only, hash-chained record of every change. Newest first. Requires `cloud.audit.read`.
      parameters:
        - name: resource_type
          in: query
          schema:
            type: string
            enum: [node, network, workload, quota]
        - name: resource_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: The `next_before` value of the previous page.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/cloud/audit/verify:
    get:
      operationId: verifyCloudAudit
      tags: [cloud]
      summary: Recompute the audit hash chain
      responses:
        "200":
          description: Whether every entry still matches its hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token with audience `parallelf-api`.

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Confirm:
      name: confirm
      in: query
      required: true
      description: The resource's name, repeated to confirm a destructive operation.
      schema:
        type: string
    ProjectFilter:
      name: project_id
      in: query
      schema:
        type: string
        format: uuid
    MetricWindow:
      name: window
      in: query
      schema:
        type: string
        enum: ["15m", "1h", "6h", "24h"]
        default: "1h"

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The access token is missing, invalid or expired.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller's roles do not grant the required permission.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: One or more fields are invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConfirmationRequired:
      description: The `confirm` parameter is missing or does not match the resource's name.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    WorkloadAccepted:
      description: Accepted; the node converges the workload asynchronously.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Workload"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        service:
          type: string
          examples: [pf-gateway]
        version:
          type: string
        checks:
          type: object
          description: Readiness checks by dependency name.
          additionalProperties:
            type: string
            enum: [ok, unavailable]

    SystemStatus:
      type: object
      additionalProperties: false
      required: [status, checked_at, components]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "`degraded` when at least one component is unavailable."
        checked_at:
          type: string
          format: date-time
        components:
          type: array
          items:
            $ref: "#/components/schemas/Component"

    Component:
      type: object
      additionalProperties: false
      required: [name, kind, status]
      properties:
        name:
          type: string
          examples: [core]
        kind:
          type: string
          enum: [service, dependency, identity-provider]
        status:
          type: string
          enum: [ok, unavailable]
        latency_ms:
          type: number
          minimum: 0
        version:
          type: string
        reported_by:
          type: string
          description: The service whose readiness check reported this dependency.

    Me:
      type: object
      additionalProperties: false
      required: [subject, username, roles, permissions]
      properties:
        subject:
          type: string
          description: Stable OIDC subject identifier.
        username:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            type: string
            pattern: "^[a-z]+\\.[a-z]+\\.[a-z]+$"

    Role:
      type: string
      enum: [owner, admin, operator, analyst, lab-researcher, viewer]

    Project:
      type: object
      additionalProperties: false
      required: [id, slug, name, description, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: "#/components/schemas/ProjectSlug"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        created_by:
          type: string
          description: OIDC subject of the creator.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectSlug:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
      description: 3-40 characters; lower-case letters, digits and hyphens.
      examples: [demo-lab]

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          $ref: "#/components/schemas/ProjectSlug"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
          default: ""

    ProjectPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type: string
          description: Present when more items exist. Pass it as `cursor`.

    AIInfo:
      type: object
      additionalProperties: false
      required: [service, version, capabilities]
      properties:
        service:
          type: string
          examples: [pf-aid]
        version:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"

    Capability:
      type: object
      additionalProperties: false
      required: [name, status, description]
      properties:
        name:
          type: string
          examples: [investigations]
        status:
          type: string
          enum: [available, not_implemented]
        description:
          type: string

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://parallelf.dev/problems/validation"]
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    Resources:
      type: object
      additionalProperties: false
      required: [vcpus, memory_mib, disk_gib]
      properties:
        vcpus:
          type: integer
        memory_mib:
          type: integer
        disk_gib:
          type: integer

    Node:
      type: object
      additionalProperties: false
      required: [id, name, status, schedulable, agent_version, kvm, docker, hypervisor, cpu_count, memory_mib,
        disk_gib, reserved_cpus, reserved_memory_mib, reserved_disk_gib, registered_at, last_seen_at,
        allocatable, allocated, workloads]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [READY, NOT_READY]
          description: NOT_READY once the agent has not synchronised for the node timeout (30 s by default).
        schedulable:
          type: boolean
          description: false while cordoned.
        agent_version:
          type: string
        kvm:
          type: boolean
          description: The node can run virtual machines.
        docker:
          type: boolean
          description: The node can run containers.
        hypervisor:
          type: string
          examples: ["libvirt 12.0.0, QEMU 10.2.1, Docker 29.4.2 (API 1.54)"]
        cpu_count:
          type: integer
        memory_mib:
          type: integer
        disk_gib:
          type: integer
        reserved_cpus:
          type: integer
        reserved_memory_mib:
          type: integer
        reserved_disk_gib:
          type: integer
        registered_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        allocatable:
          $ref: "#/components/schemas/Resources"
        allocated:
          $ref: "#/components/schemas/Resources"
        workloads:
          type: integer
          description: Live workloads placed on the node.

    NodeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Node"

    MetricPoint:
      type: object
      additionalProperties: false
      required: [at, cpu_percent, memory_used_mib]
      properties:
        at:
          type: string
          format: date-time
        cpu_percent:
          type: number
          description: Host CPU busy time, or a workload's use of its own vCPUs.
        memory_used_mib:
          type: integer
        memory_total_mib:
          type: integer
        disk_used_gib:
          type: number
        disk_total_gib:
          type: number

    Metrics:
      type: object
      additionalProperties: false
      required: [window, points]
      properties:
        window:
          type: string
          enum: ["15m", "1h", "6h", "24h"]
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"

    Flavor:
      type: object
      additionalProperties: false
      required: [id, name, vcpus, memory_mib, disk_gib]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [pf.small]
        vcpus:
          type: integer
        memory_mib:
          type: integer
        disk_gib:
          type: integer

    FlavorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Flavor"

    WorkloadKind:
      type: string
      enum: [vm, container]

    Image:
      type: object
      additionalProperties: false
      required: [id, name, kind, source, os]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/WorkloadKind"
        source:
          type: string
          description: https URL of a qcow2 image (VM) or a digest-pinned OCI reference (container).
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Checked by the node agent before a VM image is used.
        os:
          type: string

    Template:
      type: object
      additionalProperties: false
      required: [id, name, version, kind, description, image, default_flavor, static_network, deprecated]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [cirros]
        version:
          type: integer
          minimum: 1
        kind:
          $ref: "#/components/schemas/WorkloadKind"
        description:
          type: string
        image:
          $ref: "#/components/schemas/Image"
        default_flavor:
          $ref: "#/components/schemas/Flavor"
        cloud_config:
          type: object
          description: cloud-config merged into every VM's user-data.
        static_network:
          type: boolean
          description: The guest configures its own address (required on lab networks).
        command:
          type: array
          items:
            type: string
        cap_add:
          type: array
          items:
            type: string
        deprecated:
          type: boolean

    TemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Template"

    NetworkKind:
      type: string
      enum: [nat, isolated, lab]
      description: |
        nat: outbound internet through the host. isolated: no route off the
        network. lab: isolated, no DHCP, and the host has no address on it.

    Network:
      type: object
      additionalProperties: false
      required: [id, project_id, name, kind, cidr, bridge_name, created_by, created_at, workloads, capacity]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/ResourceName"
        kind:
          $ref: "#/components/schemas/NetworkKind"
        cidr:
          type: string
          examples: [10.20.1.0/24]
        gateway_ip:
          type: string
          description: The host's address on the network. Absent on lab networks.
        bridge_name:
          type: string
          pattern: "^pfbr-[0-9a-f]{8}$"
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        workloads:
          type: integer
        capacity:
          type: integer
          description: Addresses available to workloads.

    NetworkList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Network"

    ResourceName:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
      description: 3-40 characters; lower-case letters, digits and hyphens.

    NetworkCreate:
      type: object
      additionalProperties: false
      required: [project_id, name, kind, cidr]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/ResourceName"
        kind:
          $ref: "#/components/schemas/NetworkKind"
        cidr:
          type: string
          examples: [10.20.1.0/24]

    WorkloadState:
      type: string
      enum: [PENDING, SCHEDULED, PROVISIONING, RUNNING, STOPPING, STOPPED, UNKNOWN, DELETING, DELETED, ERROR]

    Workload:
      type: object
      additionalProperties: false
      required: [id, project_id, name, kind, template_id, template, template_version, flavor_id, flavor, network_id,
        network, vcpus, memory_mib, disk_gib, ip, mac, desired_state, state, generation, observed_generation,
        status_message, spec, created_by, created_at, updated_at, state_changed_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/ResourceName"
        kind:
          $ref: "#/components/schemas/WorkloadKind"
        template_id:
          type: string
          format: uuid
        template:
          type: string
        template_version:
          type: integer
        flavor_id:
          type: string
          format: uuid
        flavor:
          type: string
        network_id:
          type: string
          format: uuid
        network:
          type: string
        node_id:
          type: string
          format: uuid
        node:
          type: string
        vcpus:
          type: integer
        memory_mib:
          type: integer
        disk_gib:
          type: integer
        ip:
          type: string
        mac:
          type: string
        desired_state:
          type: string
          enum: [running, stopped, deleted]
        state:
          $ref: "#/components/schemas/WorkloadState"
        generation:
          type: integer
          description: Incremented by every requested change.
        observed_generation:
          type: integer
          description: The newest generation the node has applied.
        status_message:
          type: string
        spec:
          type: object
          additionalProperties: false
          properties:
            ssh_authorized_keys:
              type: array
              items:
                type: string
            env:
              type: object
              additionalProperties:
                type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        state_changed_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    WorkloadList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workload"

    WorkloadCreate:
      type: object
      additionalProperties: false
      required: [project_id, name, template, network_id]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/ResourceName"
        template:
          type: string
          examples: [cirros]
        template_version:
          type: integer
          minimum: 1
          description: Defaults to the newest version that is not deprecated.
        flavor:
          type: string
          description: Defaults to the template's default flavor.
        network_id:
          type: string
          format: uuid
        ssh_authorized_keys:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 4096
        env:
          type: object
          maxProperties: 32
          description: Container environment variables.
          additionalProperties:
            type: string
            maxLength: 4096

    WorkloadEvent:
      type: object
      additionalProperties: false
      required: [id, at, type, message]
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        type:
          type: string
          enum: [created, request, state, status]
        message:
          type: string

    WorkloadEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadEvent"

    Quota:
      type: object
      additionalProperties: false
      required: [project_id, max_vcpus, max_memory_mib, max_disk_gib, max_workloads, is_default]
      properties:
        project_id:
          type: string
          format: uuid
        max_vcpus:
          type: integer
        max_memory_mib:
          type: integer
        max_disk_gib:
          type: integer
        max_workloads:
          type: integer
        is_default:
          type: boolean
          description: true when the project uses the platform default.
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time

    Usage:
      type: object
      additionalProperties: false
      required: [vcpus, memory_mib, disk_gib, workloads]
      properties:
        vcpus:
          type: integer
        memory_mib:
          type: integer
        disk_gib:
          type: integer
        workloads:
          type: integer

    QuotaStatus:
      type: object
      additionalProperties: false
      required: [quota, usage]
      properties:
        quota:
          $ref: "#/components/schemas/Quota"
        usage:
          $ref: "#/components/schemas/Usage"

    QuotaUpdate:
      type: object
      additionalProperties: false
      required: [max_vcpus, max_memory_mib, max_disk_gib, max_workloads]
      properties:
        max_vcpus:
          type: integer
          minimum: 0
          maximum: 1000000
        max_memory_mib:
          type: integer
          minimum: 0
          maximum: 1000000
        max_disk_gib:
          type: integer
          minimum: 0
          maximum: 1000000
        max_workloads:
          type: integer
          minimum: 0
          maximum: 1000000

    AuditEntry:
      type: object
      additionalProperties: false
      required: [seq, id, at, actor_type, actor_id, actor_name, action, resource_type, resource_id, outcome,
        request_id, details, prev_hash, hash]
      properties:
        seq:
          type: integer
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [user, agent, system]
        actor_id:
          type: string
        actor_name:
          type: string
        action:
          type: string
          examples: [cloud.workloads.delete]
        resource_type:
          type: string
        resource_id:
          type: string
        project_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [success, denied, failed]
        request_id:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        prev_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: sha256 of prev_hash and the entry's canonical encoding.

    AuditPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_before:
          type: integer
          description: Present when older entries exist. Pass it as `before`.

    AuditVerification:
      type: object
      additionalProperties: false
      required: [valid, entries, checked_at]
      properties:
        valid:
          type: boolean
        entries:
          type: integer
        first_invalid_seq:
          type: integer
          description: The first entry whose hash does not match. Absent when valid.
        checked_at:
          type: string
          format: date-time

    VPNGateway:
      type: object
      additionalProperties: false
      required: [id, name, status, public_key, endpoint, listen_port, address, agent_version, applied_revision, revision, registered_at, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [READY, NOT_READY]
        public_key:
          type: string
          description: The gateway's WireGuard public key (base64).
        endpoint:
          type: string
          description: host:port devices dial.
        listen_port:
          type: integer
        address:
          type: string
          description: The gateway's tunnel address with prefix, e.g. 10.255.0.1/22.
        agent_version:
          type: string
        applied_revision:
          type: integer
          description: The desired-state revision the gateway last applied.
        revision:
          type: integer
          description: The current desired-state revision.
        apply_error:
          type: string
        registered_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time

    VPNGatewayList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VPNGateway"

    VPNDevice:
      type: object
      additionalProperties: false
      required: [id, name, owner_subject, owner_name, public_key, address, groups, preshared_key, state, active, connection, rx_bytes, tx_bytes, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_subject:
          type: string
        owner_name:
          type: string
        public_key:
          type: string
        address:
          type: string
          description: Tunnel IPv4 address.
        groups:
          type: array
          items:
            type: string
        preshared_key:
          type: boolean
          description: Whether the peer uses a pre-shared key (the key itself is never returned again).
        state:
          type: string
          enum: [PENDING, ENROLLED, REVOKED, EXPIRED]
        active:
          type: boolean
          description: Whether the device may send traffic now.
        active_until:
          type: string
          format: date-time
        connection:
          type: string
          enum: [online, idle, offline]
        last_handshake_at:
