openapi: 3.1.0
info:
  title: ParallelF API
  version: 1.0.0
  summary: Public HTTP API of the ParallelF platform, served by pf-gateway.
  description: |
    Every `/api/v1` route requires an OIDC access token issued by the
    platform's identity provider, sent as `Authorization: Bearer <token>`.
    The token must contain the audience `parallelf-api`.

    Errors use RFC 9457 problem details (`application/problem+json`) and
    always carry the `request_id` that also appears in the `X-Request-ID`
    response header and in service logs.
servers:
  - url: http://localhost:8000
    description: Local development gateway
tags:
  - name: health
    description: Liveness and readiness probes
  - name: system
    description: Platform-wide status
  - name: core
    description: Identity context and projects (pf-core)
  - name: cloud
    description: Nodes, networks, workloads, quotas and audit (pf-cloudd)
  - name: vpn
    description: WireGuard devices, activations, access policies and audit (pf-vpnd)
  - name: network
    description: Network monitoring, alerts, incidents, evidence and discovery scopes (pf-netguardd)
  - name: ai
    description: AI Investigator (pf-aid)
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getGatewayLiveness
      tags: [health]
      summary: Liveness of the gateway
      description: Returns 200 while the process is running. Never checks dependencies.
      security: []
      responses:
        "200":
          description: The gateway is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getGatewayReadiness
      tags: [health]
      summary: Readiness of the gateway
      security: []
      responses:
        "200":
          description: The gateway can serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      tags: [system]
      summary: Health of every platform component
      description: |
        Probes each service's readiness endpoint and the identity provider.
        The response is 200 even when components are down; read `status`.
        Requires the `system.status.read` permission.
      responses:
        "200":
          description: Aggregated status report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/core/me:
    get:
      operationId: getMe
      tags: [core]
      summary: The authenticated caller
      description: Returns the caller's identity, platform roles and effective permissions.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/core/projects:
    get:
      operationId: listProjects
      tags: [core]
      summary: List projects
      description: Returns projects in creation order. Requires `core.projects.read`.
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` value of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createProject
      tags: [core]
      summary: Create a project
      description: |
        Creates a project and records a `parallelf.core.v1.ProjectCreated`
        event in the same transaction. Requires `core.projects.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: The project was created.
          headers:
            Location:
              description: URL of the new project.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/core/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Project id (UUID).
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [core]
      summary: Get a project
      description: Requires `core.projects.read`.
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [core]
      summary: Delete a project
      description: |
        Deletes a project and records a `parallelf.core.v1.ProjectDeleted`
        event in the same transaction. Requires `core.projects.delete`.
      responses:
        "204":
          description: The project was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vpn/gateways:
    get:
      operationId: listVpnGateways
      tags: [vpn]
      summary: List VPN gateways
      description: Requires `vpn.resources.read`.
      responses:
        "200":
          description: Every gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNGatewayList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/vpn/gateways/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    delete:
      operationId: deleteVpnGateway
      tags: [vpn]
      summary: Remove a gateway
      description: Only a NOT_READY gateway. Requires `vpn.gateways.manage` and `confirm` equal to its name.
      parameters:
        - $ref: "#/components/parameters/Confirm"
      responses:
        "204":
          description: The gateway was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"
  /api/v1/vpn/devices:
    get:
      operationId: listVpnDevices
      tags: [vpn]
      summary: List devices
      description: The caller's own devices; `scope=all` lists every user's (requires `vpn.devices.manage`).
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, all]
        - name: include
          in: query
          description: "`ended` also lists revoked and expired devices."
          schema:
            type: string
            enum: [ended]
      responses:
        "200":
          description: Devices, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNDeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createVpnDevice
      tags: [vpn]
      summary: Enrol a device
      description: Send only the device's public key; the private key never leaves the device. The response carries the client configuration and, when asked for, a pre-shared key that is shown only this once. Requires `vpn.devices.use`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VPNDeviceCreate"
      responses:
        "201":
          description: The device and its client configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNEnrolment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/vpn/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getVpnDevice
      tags: [vpn]
      summary: Get a device
      description: The caller's own device, or any device for `vpn.devices.manage`.
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: revokeVpnDevice
      tags: [vpn]
      summary: Revoke a device
      description: Removes the peer from the gateway and ends its connections. Requires `confirm` equal to the device name.
      parameters:
        - $ref: "#/components/parameters/Confirm"
      responses:
        "200":
          description: The revoked device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"
  /api/v1/vpn/devices/{id}/config:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getVpnDeviceConfig
      tags: [vpn]
      summary: Get a device's client configuration
      description: Everything except the private key and the pre-shared key.
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNClientConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/vpn/devices/{id}/metrics:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getVpnDeviceMetrics
      tags: [vpn]
      summary: Get a device's traffic
      parameters:
        - $ref: "#/components/parameters/MetricWindow"
      responses:
        "200":
          description: Bytes received and sent per sample.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/vpn/devices/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: activateVpnDevice
      tags: [vpn]
      summary: Activate a device
      description: Allows the device to send traffic until the activation expires; the gateway enforces the expiry in the kernel. Only the owner may activate, and only within `PF_VPN_MAX_AUTH_AGE` of signing in (403 `reauthentication-required` otherwise).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VPNActivation"
      responses:
        "200":
          description: The active device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/vpn/devices/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: deactivateVpnDevice
      tags: [vpn]
      summary: Deactivate a device
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/vpn/devices/{id}/groups:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    put:
      operationId: setVpnDeviceGroups
      tags: [vpn]
      summary: Set a device's groups
      description: Requires `vpn.devices.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VPNGroups"
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/vpn/policies:
    get:
      operationId: listVpnPolicies
      tags: [vpn]
      summary: List access policies
      description: In evaluation order.
      responses:
        "200":
          description: Policies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNPolicyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createVpnPolicy
      tags: [vpn]
      summary: Create an access policy
      description: Requires `vpn.policies.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VPNPolicyCreate"
      responses:
        "201":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/vpn/policies/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    delete:
      operationId: deleteVpnPolicy
      tags: [vpn]
      summary: Delete an access policy
      description: Requires `vpn.policies.manage` and `confirm` equal to its name.
      parameters:
        - $ref: "#/components/parameters/Confirm"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"
  /api/v1/vpn/audit:
    get:
      operationId: listVpnAudit
      tags: [vpn]
      summary: List the VPN audit trail
      description: Newest first. Requires `vpn.audit.read`.
      parameters:
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: before
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/vpn/audit/verify:
    get:
      operationId: verifyVpnAudit
      tags: [vpn]
      summary: Verify the VPN audit chain
      description: Requires `vpn.audit.read`.
      responses:
        "200":
          description: The verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/network/overview:
    get:
      operationId: getNetworkOverview
      tags:
      - network
      summary: NetGuard at a glance
      description: Requires `network.resources.read`.
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/network/sensors:
    get:
      operationId: listNetworkSensors
      tags:
      - network
      summary: List sensors
      responses:
        '200':
          description: Sensors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSensorList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/network/sensors/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    delete:
      operationId: deleteNetworkSensor
      tags:
      - network
      summary: Remove a silent sensor
      description: Requires `network.sensors.manage` and `confirm` equal to its name. Its telemetry is deleted with it.
      parameters:
      - $ref: '#/components/parameters/Confirm'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/ConfirmationRequired'
  /api/v1/network/events:
    get:
      operationId: listNetworkEvents
      tags:
      - network
      summary: List telemetry
      description: Newest first.
      parameters:
      - name: ip
        in: query
        schema:
          type: string
        description: Source or destination address.
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - flow
          - dns
          - http
          - tls
          - alert
          - anomaly
          - discovery
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/network/events/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      operationId: getNetworkEvent
      tags:
      - network
      summary: Get an event
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/network/assets:
    get:
      operationId: listNetworkAssets
      tags:
      - network
      summary: List assets
      description: Every address seen on a monitored network, with who holds it now.
      responses:
        '200':
          description: Assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAssetList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/network/alerts:
    get:
      operationId: listNetworkAlerts
      tags:
      - network
      summary: List alerts
      description: Most recently seen first.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - acknowledged
          - closed
          - suppressed
      - name: detector
        in: query
        schema:
          type: string
      - name: severity
        in: query
        schema:
          type: string
          enum:
          - info
          - low
          - medium
          - high
          - critical
        description: Minimum severity.
      - name: ip
        in: query
        schema:
          type: string
        description: Source or destination address.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAlertList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/network/alerts/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getNetworkAlert
      tags:
      - network
      summary: Get an alert with its telemetry
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAlertDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/network/alerts/{id}/status:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: changeNetworkAlertStatus
      tags:
      - network
      summary: Acknowledge, close, suppress or reopen an alert
      description: Requires `network.alerts.triage`. Suppression needs a reason and lasts at most 720h.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkAlertStatusChange'
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAlert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/network/incidents:
    get:
      operationId: listNetworkIncidents
      tags:
      - network
      summary: List incidents
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - investigating
          - resolved
      responses:
