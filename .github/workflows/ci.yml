name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.32"

jobs:
  contracts:
    name: Contracts (OpenAPI, Protobuf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint and format-check Protobuf
        run: |
          buf lint
          buf format --diff --exit-code

      - name: Check Protobuf backward compatibility against main
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#ref=origin/main'
          else
            echo "main has no Protobuf contracts yet; nothing to compare against."
          fi

      - name: Check generated Protobuf code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2 lint api/openapi/parallelf.v1.yaml

  go:
    name: Go (lint, unit and PostgreSQL integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: parallelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parallelf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: ci-postgres-password
      POSTGRES_USER: postgres
      POSTGRES_DB: parallelf
      PF_CORE_OWNER_DB_PASSWORD: ci-owner-password
      PF_CORE_DB_PASSWORD: ci-runtime-password
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Create roles and schemas
        run: sh deploy/postgres/init/10-roles-and-schemas.sh

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/services/core/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 \
            -path /migrations \
            -database "postgres://pf_core_owner:${PF_CORE_OWNER_DB_PASSWORD}@localhost:5432/parallelf?sslmode=disable&search_path=core" \
            up

      - name: Test
        env:
          PF_TEST_DATABASE_URL: postgres://pf_core:ci-runtime-password@localhost:5432/parallelf?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Fail if PostgreSQL integration tests were skipped
        env:
          PF_TEST_DATABASE_URL: postgres://pf_core:ci-runtime-password@localhost:5432/parallelf?sslmode=disable
        run: |
          out=$(go test -count=1 -v ./services/core/internal/store/...)
          echo "$out" | grep -E "^(=== RUN|--- (PASS|FAIL|SKIP)|ok|FAIL)" || true
          if echo "$out" | grep -q -- "--- SKIP"; then
            echo "::error::store integration tests were skipped"
            exit 1
          fi

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  python:
    name: Python (lint, types, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pipx install uv==${{ env.UV_VERSION }}

      - name: Install dependencies from the lockfile
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  web:
    name: Dashboard (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Check generated API types are up to date
        run: |
          pnpm run gen:api
          git diff --exit-code -- lib/api/schema.gen.ts

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  stack:
    name: Stack (Compose launch, integration and end-to-end tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Create .env with generated secrets
        run: make init

      - name: Build and start the stack
        run: make up

      - name: Show container state
        run: make ps

      - name: Smoke test
        run: make verify

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv and Python dependencies
        run: |
          pipx install uv==${{ env.UV_VERSION }}
          uv sync --locked --all-packages

      - name: Integration tests
        run: make test-integration

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dashboard dependencies and a browser
        working-directory: web/dashboard
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: make test-e2e

      - name: Service logs
        if: always()
        run: docker compose --env-file .env -f deploy/compose/compose.yaml logs --no-color --tail 300

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/dashboard/playwright-report
            web/dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: make clean
