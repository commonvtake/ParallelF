name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.8"

jobs:
  contracts:
    name: Contracts (OpenAPI, Protobuf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint and format-check Protobuf
        run: |
          buf lint
          buf format --diff --exit-code

      - name: Check Protobuf backward compatibility against main
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#ref=origin/main'
          else
            echo "main has no Protobuf contracts yet; nothing to compare against."
          fi

      - name: Check generated Protobuf code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2 lint api/openapi/parallelf.v1.yaml

  go:
    name: Go (lint, unit and PostgreSQL integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: parallelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parallelf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: ci-postgres-password
      POSTGRES_USER: postgres
      POSTGRES_DB: parallelf
      PF_CORE_OWNER_DB_PASSWORD: ci-owner-password
      PF_CORE_DB_PASSWORD: ci-runtime-password
      PF_CLOUD_OWNER_DB_PASSWORD: ci-cloud-owner-password
      PF_CLOUD_DB_PASSWORD: ci-cloud-runtime-password
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Create roles and schemas
        run: sh deploy/postgres/init/10-roles-and-schemas.sh

      - name: Apply migrations
        run: |
          for svc in core cloud; do
            owner_pw_var="PF_$(echo $svc | tr a-z A-Z)_OWNER_DB_PASSWORD"
            docker run --rm --network host \
              -v "$PWD/services/$svc/migrations:/migrations:ro" \
              migrate/migrate:v4.18.3 \
              -path /migrations \
              -database "postgres://pf_${svc}_owner:$(printenv $owner_pw_var)@localhost:5432/parallelf?sslmode=disable&search_path=${svc}" \
              up
          done

      - name: Test
        env:
          PF_TEST_DATABASE_URL: postgres://pf_core:ci-runtime-password@localhost:5432/parallelf?sslmode=disable
          PF_TEST_CLOUD_DATABASE_URL: postgres://pf_cloud:ci-cloud-runtime-password@localhost:5432/parallelf?sslmode=disable
          PF_TEST_ADMIN_DATABASE_URL: postgres://postgres:ci-postgres-password@localhost:5432/parallelf?sslmode=disable
        run: |
          status=0
          go test -race -count=1 -coverprofile=coverage.out -v ./... > go-test.log 2>&1 || status=$?
          grep -E "^(--- FAIL|FAIL|ok|panic)|_test.go:[0-9]+:" go-test.log || true
          exit $status

      - name: Fail if PostgreSQL integration tests were skipped
        run: |
          if grep -qE -- "--- SKIP|skipping the tamper" go-test.log; then
            grep -E -- "--- SKIP|skipping" go-test.log
            echo "::error::store integration tests were skipped"
            exit 1
          fi

      # The store tests share one database with every earlier run, as on a
      # developer's machine: running them again must still pass.
      - name: Store tests are repeatable
        env:
          PF_TEST_DATABASE_URL: postgres://pf_core:ci-runtime-password@localhost:5432/parallelf?sslmode=disable
          PF_TEST_CLOUD_DATABASE_URL: postgres://pf_cloud:ci-cloud-runtime-password@localhost:5432/parallelf?sslmode=disable
          PF_TEST_ADMIN_DATABASE_URL: postgres://postgres:ci-postgres-password@localhost:5432/parallelf?sslmode=disable
        run: go test -count=1 ./services/core/internal/store/... ./services/cloud/internal/store/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  python:
    name: Python (lint, types, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pipx install uv==${{ env.UV_VERSION }}

      - name: Install dependencies from the lockfile
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  web:
    name: Dashboard (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Check generated API types are up to date
        run: |
          pnpm run gen:api
          git diff --exit-code -- lib/api/schema.gen.ts

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  stack:
    name: Stack (Compose, compute host with KVM, integration and end-to-end tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Create .env with generated secrets
        run: make init

      - name: Build and start the stack
        run: make up

      - name: Show container state
        run: make ps

      - name: Smoke test
        run: make verify

      # The runner becomes a ParallelF compute host: hosted runners expose
      # /dev/kvm, so real VMs boot under nested virtualisation.
      - name: Prepare the compute host (KVM, libvirt, QEMU)
        run: make cloud-host-setup

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install the node agent as a systemd service
        run: |
          make agent-install
          make agent-check

      - name: One host, one VM (make verify-cloud)
        run: make verify-cloud

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv and Python dependencies
        run: |
          pipx install uv==${{ env.UV_VERSION }}
          uv sync --locked --all-packages

      - name: Integration tests
        env:
          PF_REQUIRE_CLOUD_NODE: "1"
          PF_CLOUD_DISRUPTIVE_TESTS: "1"
        run: |
          export PF_TEST_ADMIN_DATABASE_URL="postgres://postgres:$(grep ^POSTGRES_PASSWORD= .env | cut -d= -f2)@localhost:5432/parallelf"
          make test-integration

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dashboard dependencies and a browser
        working-directory: web/dashboard
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          PF_REQUIRE_CLOUD_NODE: "1"
        run: make test-e2e

      - name: Compute host state
        if: always()
        run: |
          sudo virsh -c qemu:///system list --all || true
          sudo virsh -c qemu:///system net-list --all || true
          docker ps -a --filter label=io.parallelf.managed=true || true
          sudo ls -la /var/lib/parallelf/cloud /var/lib/parallelf/cloud/instances 2>/dev/null || true
          for f in /var/lib/parallelf/cloud/instances/*/console.log; do
            [ -f "$f" ] && { echo "== $f"; sudo tail -c 2000 "$f"; } || true
          done

      - name: Node agent log
        if: always()
        run: sudo journalctl -u pf-node-agent --no-pager -n 400 || true

      - name: Service logs
        if: always()
        run: docker compose --env-file .env -f deploy/compose/compose.yaml logs --no-color --tail 300

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/dashboard/playwright-report
            web/dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: make clean
