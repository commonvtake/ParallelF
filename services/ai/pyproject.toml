[project]
name = "pf-aid"
version = "0.1.0"
description = "ParallelF AI Investigator service (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pf-common",
    "uvicorn>=0.34",
]

[project.scripts]
pf-aid = "pf_aid.main:main"

[tool.uv.sources]
pf-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pf_aid"]
